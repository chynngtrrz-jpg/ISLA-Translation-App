name: isla_app
description: ISLA language selection screen.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  camera: ^0.12.1
  characters: ^1.4.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_tts: ^4.2.5
  google_mlkit_text_recognition: ^0.17.1
  image: ^4.10.1
  image_picker: ^1.2.4
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  speech_to_text: ^7.5.0
  permission_handler: 12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  archive: ^4.4.0
  xml: ^7.1.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon_full.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 700
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 800
    - family: Alegreya
      fonts:
        - asset: assets/fonts/Alegreya-Regular.ttf
          weight: 400
        - asset: assets/fonts/Alegreya-Medium.ttf
          weight: 500
  assets:
    - assets/images/
    - assets/phrasebook/