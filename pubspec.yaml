name: isla_app
description: ISLA language selection screen.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  camera: ^0.12.1
  characters: ^1.4.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_tts: ^4.2.5
  google_mlkit_text_recognition: ^0.17.1
  image_picker: ^1.2.4
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/l10n/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 700
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 800